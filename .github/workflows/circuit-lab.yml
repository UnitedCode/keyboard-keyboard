name: Circuit models
on:
  pull_request:
    paths: ['circuits/**', 'tools/circuit-lab/**', '.github/workflows/circuit-lab.yml']
  push:
    branches: [main]
    paths: ['circuits/**', 'tools/circuit-lab/**', '.github/workflows/circuit-lab.yml']
permissions:
  contents: read
jobs:
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libngspice0-dev libdigest-sha-perl
      - run: cargo fmt --manifest-path tools/circuit-lab/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/circuit-lab/Cargo.toml --target x86_64-unknown-linux-gnu --all-features
      - run: cargo clippy --locked --manifest-path tools/circuit-lab/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets --all-features -- -D warnings
