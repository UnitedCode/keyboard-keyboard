[package]
name = "keyboard-circuit-lab"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["spice"]
spice = ["circuit-workbench/spice"]
daisy = ["circuit-workbench/daisy"]
device = ["circuit-workbench/device"]

[dependencies]
circuit-workbench = { git = "https://github.com/UnitedCode/synth-phone-e-v2-rust", rev = "c41fa0c5d20e4e7fa3821f753014b9b0b386a3c1", default-features = false }
