[package]
name = "keyboard-circuit-lab"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["spice"]
spice = ["circuit-workbench/spice"]
daisy = ["circuit-workbench/daisy"]
device = ["circuit-workbench/device"]

[dependencies]
circuit-workbench = { git = "https://github.com/UnitedCode/synth-phone-e-v2-rust", rev = "51c528e832d58dddd6f393cf89e03942546f5df6", default-features = false }
